<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply saved theme ASAP to avoid flash; default is light for all new visitors
			(function() {
				try {
					var t = localStorage.getItem('theme');
					document.documentElement.classList.toggle('dark', t === 'dark');
				} catch (_) { /* noop */ }
			})();
		</script>
		%sveltekit.head%
		<script src="https://t.contentsquare.net/uxa/93907aed0aa5b.js"></script>
		<script>
			window._browsee = window._browsee || function () { (_browsee.q = _browsee.q || []).push(arguments) };
			_browsee('init', '85fdc0524cdc9c88b4d546170614f5c754a0243469cab633');
		</script>
		<script async src='https://cdn.browsee.io/js/browsee.min.js'></script>
		
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
