<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply saved theme ASAP to avoid flash; default is light for all new visitors
			(function() {
				try {
					var t = localStorage.getItem('theme');
					document.documentElement.classList.toggle('dark', t === 'dark');
				} catch (_) { /* noop */ }
			})();
		</script>
		%sveltekit.head%
		<script src="https://t.contentsquare.net/uxa/93907aed0aa5b.js"></script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
